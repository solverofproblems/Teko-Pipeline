<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b111e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Teko · Pipeline Técnico do Psicólogo</title>
  
  <!-- Tipografia Moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #0b111e;
      --bg-surface: rgba(18, 26, 43, 0.88);
      --bg-surface-solid: #121a2b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-teal: #14b8a6;
      --accent-teal-dark: #0d9488;
      --accent-purple: #a855f7;
      --shadow-elevation: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-surface: rgba(255, 255, 255, 0.92);
      --bg-surface-solid: #ffffff;
      --border-color: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-teal: #0d9488;
      --accent-teal-dark: #0f766e;
      --accent-purple: #7e22ce;
      --shadow-elevation: 0 10px 30px -5px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow: hidden;
      height: 100%;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* Barra Superior Responsiva */
    header {
      min-height: 60px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      z-index: 1000;
      flex-shrink: 0;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-tag {
      background: linear-gradient(135deg, var(--accent-teal), var(--accent-purple));
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(20, 184, 166, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Controles e Botões */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      background: var(--bg-surface-solid);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:hover {
      border-color: var(--accent-teal);
    }

    .btn-primary {
      background: var(--accent-teal);
      color: #ffffff;
      border-color: var(--accent-teal);
      box-shadow: 0 2px 10px rgba(20, 184, 166, 0.3);
    }

    .btn-primary:hover {
      background: var(--accent-teal-dark);
      border-color: var(--accent-teal-dark);
    }

    /* Container do Diagrama */
    #diagram-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: var(--bg-page);
    }

    /* Ajuste no elemento nativo do mxgraph */
    .mxgraph {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      touch-action: pinch-zoom pan-x pan-y;
      -webkit-user-select: none;
      user-select: none;
    }

    .mxgraph svg {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.05));
      max-width: none !important;
    }

    /* Barra de Zoom Flutuante (Mobile e Desktop) */
    .floating-zoom-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 600;
    }

    .zoom-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 600;
      box-shadow: var(--shadow-elevation);
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .zoom-btn:active {
      transform: scale(0.92);
      background: var(--accent-teal);
      color: #fff;
    }

    /* Dica Flutuante Inferior Responsiva */
    .floating-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-elevation);
      z-index: 500;
      max-width: calc(100vw - 32px);
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .floating-bar::-webkit-scrollbar {
      display: none;
    }

    .floating-bar strong {
      color: var(--text-main);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Banner informativo para Mobile */
    .mobile-tip {
      display: none;
    }

    /* Responsividade para Telas Menores e Celulares */
    @media (max-width: 768px) {
      header {
        padding: max(8px, env(safe-area-inset-top)) 10px 8px 10px;
        min-height: 50px;
        gap: 6px;
      }

      .brand {
        gap: 6px;
      }

      .brand-tag {
        font-size: 0.65rem;
        padding: 3px 6px;
        letter-spacing: 0.05em;
      }

      .brand-title {
        font-size: 0.86rem;
        max-width: 170px;
      }

      .brand-sub {
        display: none;
      }

      .controls {
        gap: 6px;
      }

      .btn {
        padding: 6px 8px;
        font-size: 0.75rem;
        border-radius: 7px;
      }

      .btn span.btn-text {
        display: none;
      }

      .floating-zoom-controls {
        top: 10px;
        right: 10px;
        gap: 6px;
      }

      .zoom-btn {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
        border-radius: 8px;
      }

      /* Barra flutuante inferior fixa, rolável e visível em todos os celulares */
      .floating-bar {
        bottom: max(10px, env(safe-area-inset-bottom));
        padding: 6px 10px;
        font-size: 0.7rem;
        gap: 10px;
        max-width: 96vw;
        border-radius: 18px;
        justify-content: flex-start;
      }

      .desktop-tip {
        display: none;
      }

      .mobile-tip {
        display: inline;
        flex-shrink: 0;
      }
    }

    @media (max-width: 400px) {
      header {
        padding: max(6px, env(safe-area-inset-top)) 8px 6px 8px;
      }

      .brand-tag {
        font-size: 0.6rem;
        padding: 2px 5px;
      }

      .brand-title {
        max-width: 130px;
        font-size: 0.8rem;
      }

      .btn {
        padding: 5px 7px;
        font-size: 0.72rem;
      }

      .floating-bar {
        font-size: 0.68rem;
        gap: 8px;
        padding: 5px 8px;
      }
    }

    @media (max-width: 340px) {
      .brand-title {
        max-width: 105px;
        font-size: 0.75rem;
      }

      .zoom-btn {
        width: 32px;
        height: 32px;
        font-size: 0.95rem;
      }
    }

    /* Ocultar a barra de ferramentas padrão do mxgraph para evitar poluição visual e conflitos em touch */
    .geToolbar {
      display: none !important;
    }
  </style>
</head>

  <!-- Hook global para capturar imediatamente a instância do GraphViewer e mxGraph assim que criados -->
  <script>
    window.appGraph = null;
    window.appViewer = null;

    // Redefinimos GraphViewer.viewerInitialized antes do viewer carregar
    window.onGraphReady = function(viewer) {
      window.appViewer = viewer;
      window.appGraph = viewer.graph;
      
      const graph = viewer.graph;
      if (graph) {
        // Habilita panning nativo interno
        if (typeof graph.setPanning === 'function') {
          graph.setPanning(true);
        }
        if (graph.panningHandler) {
          graph.panningHandler.useLeftButtonForPanning = true;
          graph.panningHandler.ignoreCell = true;
        }

        // Ajusta automaticamente para a tela do aparelho
        setTimeout(() => {
          fitAndCenter();
        }, 50);
      }
    };
  </script>

  <!-- Script Oficial do Visualizador Draw.io -->
  <script type="text/javascript" src="https://app.diagrams.net/js/viewer-static.min.js"></script>

  <script>
    // Conecta ao callback do viewer
    if (typeof GraphViewer !== 'undefined') {
      const originalViewerInit = GraphViewer.viewerInitialized;
      GraphViewer.viewerInitialized = function(viewer) {
        if (typeof originalViewerInit === 'function') {
          originalViewerInit.apply(this, arguments);
        }
        window.onGraphReady(viewer);
      };
    }

    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', next);
      
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.querySelector('#theme-btn .btn-text');
      
      if (themeIcon) themeIcon.textContent = next === 'dark' ? '☀️' : '🌙';
      if (themeText) themeText.textContent = next === 'dark' ? 'Modo Claro' : 'Modo Escuro';
    }

    // Helper robusto para acessar o objeto mxGraph
    function getGraphInstance() {
      if (window.appGraph) return window.appGraph;
      if (window.appViewer && window.appViewer.graph) return window.appViewer.graph;
      const el = document.querySelector('.mxgraph');
      if (el && el.mxgraph) return el.mxgraph;
      return null;
    }

    // Zoom direto com suporte ao viewBox do SVG ou graph.view
    function zoomIn() {
      const graph = getGraphInstance();
      if (graph && typeof graph.zoomIn === 'function') {
        graph.zoomIn();
      } else {
        svgZoom(1.2);
      }
    }

    function zoomOut() {
      const graph = getGraphInstance();
      if (graph && typeof graph.zoomOut === 'function') {
        graph.zoomOut();
      } else {
        svgZoom(0.8);
      }
    }

    function fitAndCenter() {
      const graph = getGraphInstance();
      if (graph) {
        if (typeof graph.fit === 'function') graph.fit();
        if (typeof graph.center === 'function') graph.center();
      }
      // Garante reset de qualquer transformação manual do SVG
      const svg = document.querySelector('#diagram-container svg');
      if (svg) {
        svg.style.transform = '';
        svg.style.transformOrigin = 'center center';
      }
    }

    function resetView() {
      fitAndCenter();
    }

    // Fallback de transformação suave no SVG caso o mxGraph interno bloqueie
    let svgCurrentScale = 1;
    let svgPanX = 0;
    let svgPanY = 0;

    function applySvgTransform() {
      const svg = document.querySelector('#diagram-container svg');
      if (svg) {
        svg.style.transformOrigin = '0 0';
        svg.style.transform = `translate(${svgPanX}px, ${svgPanY}px) scale(${svgCurrentScale})`;
      }
    }

    function svgZoom(factor) {
      svgCurrentScale = Math.min(Math.max(svgCurrentScale * factor, 0.25), 8);
      applySvgTransform();
    }

    // GESTOS MULTI-TOUCH ULTRA RESPONSIVOS (PINCH TO ZOOM E PAN COM OS DEDOS)
    function setupTouchGestures() {
      const container = document.getElementById('diagram-container');
      if (!container) return;

      let initialPinchDistance = 0;
      let initialScale = 1;
      let lastTouchX = 0;
      let lastTouchY = 0;
      let isTouching = false;
      let isPinching = false;
      let lastTapTime = 0;

      function getDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.hypot(dx, dy);
      }

      function getMidpoint(t1, t2) {
        return {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
      }

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          // Início do Pinch-to-zoom (2 dedos)
          isPinching = true;
          isTouching = false;
          initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
          const graph = getGraphInstance();
          initialScale = (graph && graph.view) ? graph.view.scale : svgCurrentScale;
        } else if (e.touches.length === 1) {
          // Início do Panning / Drag (1 dedo)
          isTouching = true;
          isPinching = false;
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;

          // Detecção de Double Tap para resetar ou dar zoom
          const now = Date.now();
          if (now - lastTapTime < 300) {
            fitAndCenter();
          }
          lastTapTime = now;
        }
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        const graph = getGraphInstance();

        if (e.touches.length === 2 && isPinching) {
          // GESTO DE PINÇA: Zoom In / Zoom Out contínuo e responsivo
          e.preventDefault();
          const currentDistance = getDistance(e.touches[0], e.touches[1]);
          if (initialPinchDistance > 0) {
            const pinchRatio = currentDistance / initialPinchDistance;

            if (graph && graph.view && typeof graph.zoom === 'function') {
              // Aplica zoom suave no mxGraph
              const newScale = initialScale * pinchRatio;
              if (newScale >= 0.1 && newScale <= 6.0) {
                graph.zoomTo(newScale, true);
              }
            } else {
              // Fallback para SVG se graph.zoom não estiver exposto
              svgCurrentScale = Math.min(Math.max(initialScale * pinchRatio, 0.25), 8);
              applySvgTransform();
            }
          }
        } else if (e.touches.length === 1 && isTouching) {
          // GESTO DE ARRASTO: Mover o diagrama com 1 dedo
          const deltaX = e.touches[0].clientX - lastTouchX;
          const deltaY = e.touches[0].clientY - lastTouchY;

          if (graph && graph.view && typeof graph.view.setTranslate === 'function') {
            e.preventDefault();
            const currentTranslate = graph.view.translate || { x: 0, y: 0 };
            const scale = graph.view.scale || 1;
            graph.view.setTranslate(
              currentTranslate.x + deltaX / scale,
              currentTranslate.y + deltaY / scale
            );
          } else {
            // Fallback para o container ou SVG
            e.preventDefault();
            svgPanX += deltaX;
            svgPanY += deltaY;
            applySvgTransform();
          }

          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: false });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          isPinching = false;
        }
        if (e.touches.length === 0) {
          isTouching = false;
        }
      }, { passive: true });
    }

    // Inicia os listeners de touch e resize
    window.addEventListener('DOMContentLoaded', () => {
      setupTouchGestures();
    });

    window.addEventListener('load', () => {
      setupTouchGestures();
      setTimeout(fitAndCenter, 300);
      setTimeout(fitAndCenter, 1000);
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitAndCenter, 200);
    });
  </script>
</body>
</html>
